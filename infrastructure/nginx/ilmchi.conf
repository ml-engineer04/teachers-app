# ==============================================================================
# Ilmçi (ilmchi.uz) Production Nginx Configuration
# Architecture: Single Web Platform (Teacher + Admin SPA) + NestJS Backend API
# ==============================================================================

# 1. Backend REST API — api.ilmchi.uz
server {
    listen 80;
    server_name api.ilmchi.uz;

    client_max_body_size 250M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large PDF/Media uploads and streaming
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# 2. Unified Frontend (ilmchi.uz, www.ilmchi.uz, admin.ilmchi.uz)
server {
    listen 80;
    server_name ilmchi.uz www.ilmchi.uz admin.ilmchi.uz;

    root /var/www/ilmchi/apps/web/dist;
    index index.html;

    client_max_body_size 250M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Static assets long-term cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # APK / Mobile downloads
    location /downloads/ {
        alias /var/www/ilmchi/apps/web/dist/downloads/;
        autoindex off;
        add_header Content-Disposition 'attachment';
    }

    # API Proxy for unified same-origin routing
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
