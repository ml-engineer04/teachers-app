# ==============================================================================
# Ilmchi (ilmchi.uz) Textbook Page Images Static Cache & CDN Configuration
# File: infrastructure/nginx/book-images-cache.conf
# ==============================================================================
#
# USAGE:
# Include this file inside the `server { ... }` block of `api.ilmchi.uz` and `ilmchi.uz`
# in `/etc/nginx/sites-available/ilmchi.conf`:
#
#     include /var/www/ilmchi/infrastructure/nginx/book-images-cache.conf;
#
# ==============================================================================

# 1. Direct Static Nginx Bypass for Textbook Page Images
# Bypasses Node.js completely when the rendered JPEG/PNG is present on disk.
# Serves the image within <2ms with zero Node.js process load!
location ~ ^/api/(v1/)?content/books/(?<book_id>[^/]+)/pages/(?<page_num>[0-9]+)/image$ {
    # Path where rendered pages are stored on the server:
    root /var/www/ilmchi;

    # Try optimized .jpg first, then legacy .png, and fallback to Node.js backend if not rendered yet
    try_files /.data/rendered-pages/${book_id}_p${page_num}.jpg
              /.data/rendered-pages/${book_id}_p${page_num}.png
              @api_node_backend;

    # Cache headers for browser and CDN edge caching (1 year immutable)
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header X-Served-By "Nginx-Static-Bypass" always;

    # Performance tuning for static file transmission
    tcp_nodelay on;
    open_file_cache max=1000 inactive=120s valid=180s min_uses=1;
    open_file_cache_errors off;
    access_log off;
}

