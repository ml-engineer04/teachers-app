# ==============================================================================
# CLOUDFLARE CDN CONFIGURATION GUIDE
# ==============================================================================
# To cache rendered book pages and PDF files globally on Cloudflare Edge:
#
# 1. Log in to Cloudflare Dashboard -> Rules -> Cache Rules (or Page Rules)
# 2. Create a new Cache Rule named: "Ilmchi Book Pages & Media"
# 3. Matching Criteria (Rule expression):
#      (http.request.uri.path contains "/api/v1/content/books/" and http.request.uri.path contains "/pages/" and http.request.uri.path contains "/image")
# 4. Cache Settings:
#      - Cache eligibility: Eligible for cache (Cache Everything)
#      - Edge TTL: Respect origin (or Override: 1 month / 1 year)
#      - Browser TTL: Respect origin (31536000)
#      - Cache Key: Include Query String (Important: enables ?v= cache busting!)
# 5. Benefits:
#      - Near 0ms latency for mobile users anywhere
#      - Zero server CPU load on page flings & fast scrolls
#      - Automatic Brotli/Gzip compression on CDN edge
